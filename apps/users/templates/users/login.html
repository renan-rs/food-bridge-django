<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Entrar - Food Bridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Entrar no Food Bridge</h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}

            {{ form.as_p }}
            <button type="submit" class="w-full mt-4 bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">Entrar</button>
        </form>
        <p class="mt-4 text-sm text-center text-gray-600">
            Não tem uma conta? <a href="{% url 'users:signup' %}" class="text-green-600 font-semibold">Cadastre-se</a>
        </p>
    </div>
</body>
</html>
